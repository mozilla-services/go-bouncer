version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  build:
    docker:
      - image: cimg/base:2026.11
    working_directory: ~/dockerflow
    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Create a version.json
          command: |
            # create a version.json per https://github.com/mozilla-services/Dockerflow/blob/master/docs/version_object.md
            printf '{"commit":"%s","version":"%s","source":"https://github.com/%s/%s","build":"%s"}\n' \
            "$CIRCLE_SHA1" \
            "$CIRCLE_TAG" \
            "$CIRCLE_PROJECT_USERNAME" \
            "$CIRCLE_PROJECT_REPONAME" \
            "$CIRCLE_BUILD_URL" > version.json
      - run:
          name: Build Docker image
          command: docker build -t app:build .

  test:
    docker:
      - image: cimg/go:1.27.4
      - image: cimg/mysql:8.4
    steps:
      - checkout
      - run:
          name: Waiting for MySQL to be ready
          command: |
            for i in `seq 1 60`;
            do
              nc -z 127.0.0.1 3306 && echo Success && exit 0
              echo -n .
              sleep 1
            done
            echo Failed waiting for MySQL && exit 1
      - run:
          name: Install MySQL CLI; Import test data
          command: |
            sudo apt update && sudo apt install -y default-mysql-client
            mysql -u root -h 127.0.0.1 --port=3306 -e 'create database bouncer_test;'
            mysql -u root -h 127.0.0.1 --port=3306 bouncer_test < ./docker/initdb.d/01-schema.sql
            mysql -u root -h 127.0.0.1 --port=3306 bouncer_test < ./docker/initdb.d/02-data.sql
      - run:
          name: Get dependencies
          command: |
            go get
      - run:
          name: Go test
          command: |
            go test -v -mod vendor -covermode=atomic -coverprofile=coverage.txt ./...
      - run:
          name: Go lint
          command: |
            go vet ./...

            go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
            $(go env GOPATH)/bin/staticcheck ./...
      - codecov/upload

workflows:
  version: 2
  build-test:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/

      - test:
          filters:
            tags:
              only: /.*/
